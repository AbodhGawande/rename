<!doctype html>
<html lang="en" data-accent="sky">
<head>
<meta charset="utf-8">
<title>Rename</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rename">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Find a name for our son — together.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i><i class="a4"></i><i class="a5"></i></div>
<!-- Aarush's shapes: soft geometric outlines drifting behind the glass -->
<svg class="shapes" viewBox="0 0 400 860" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <g class="sh s1"><circle cx="0" cy="0" r="46"/></g>
  <g class="sh s2"><polygon points="0,-52 48,32 -48,32"/></g>
  <g class="sh s3"><rect x="-38" y="-38" width="76" height="76" rx="14"/></g>
  <g class="sh s4"><polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"/></g>
  <g class="sh s5"><polygon points="0,-54 16,-18 54,-18 24,6 34,44 0,22 -34,44 -24,6 -54,-18 -16,-18"/></g>
  <g class="sh s6"><circle cx="0" cy="0" r="24"/></g>
  <g class="sh s7"><polygon points="0,-40 40,0 0,40 -40,0"/></g>
  <g class="sh s8"><polygon points="0,-30 28,20 -28,20"/></g>
  <g class="sh s9"><rect x="-22" y="-22" width="44" height="44" rx="8"/></g>
  <g class="sh s10"><polygon points="0,-36 34,-11 21,30 -21,30 -34,-11"/></g>
</svg>

<div id="app">
  <header class="top">
    <div class="brand"><span class="logo">Re<em>name</em></span><span class="who" id="whoLabel"></span></div>
    <div class="actions">
      <button class="iconbtn az" id="azBtn" title="Browse by letter">A–Z</button>
      <button class="iconbtn" id="syncBtn" title="Sync"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 3v6h-6M3 21v-6h6"/></svg><i class="dot"></i></button>
      <button class="iconbtn" id="settingsBtn" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <main>
    <!-- Discover -->
    <section class="screen on" id="s-discover">
      <div class="deckwrap">
        <div class="deck" id="deck"></div>
        <div class="deckbtns">
          <button class="undo" id="undoBtn" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
          <button class="nope" data-vote="dislike" title="Not for us"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
          <button class="like" data-vote="like" title="Like"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3.2 4.8 6.8 4.8c2 0 3.4 1.1 4.2 2.3.8-1.2 2.2-2.3 4.2-2.3 3.6 0 5.8 3.6 4.4 6.9C19.5 16.4 12 21 12 21z"/></svg></button>
          <button class="love" data-vote="love" title="Love it"><svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2l-6.1 3.4 1.4-6.8L2.2 9.1l6.9-.8z"/></svg></button>
          <button class="skip" data-vote="skip" title="Skip for now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4v16M9 12l10-8v16z"/></svg></button>
        </div>
        <div class="progress" id="progress"></div>
      </div>
      <div class="reasons glass strong" id="reasons">
        <div class="hd"><b id="reasonsTitle">Why?</b><button id="reasonsDone">Done</button></div>
        <div class="chips" id="reasonChips"></div>
      </div>
    </section>

    <!-- Shortlist -->
    <section class="screen" id="s-shortlist">
      <div class="scroll">
        <h2 class="title">Shortlist</h2>
        <div class="seg glass" id="listSeg"></div>
        <div id="list"></div>
      </div>
    </section>

    <!-- Face-off -->
    <section class="screen" id="s-faceoff">
      <div class="faceoff" id="faceoff"></div>
    </section>

    <!-- Taste -->
    <section class="screen" id="s-taste">
      <div class="scroll" id="taste"></div>
    </section>
  </main>

  <nav class="tabs glass strong" id="tabs">
    <button data-tab="discover" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="13" height="18" rx="2.5"/><path d="M20 7v10"/></svg>Discover</button>
    <button data-tab="shortlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.6-9.6-9.3C1 8.4 3.2 4.8 6.8 4.8c2 0 3.4 1.1 4.2 2.3.8-1.2 2.2-2.3 4.2-2.3 3.6 0 5.8 3.6 4.4 6.9C19.5 16.4 12 21 12 21z"/></svg>Shortlist<span class="badge" id="bothBadge" style="display:none"></span></button>
    <button data-tab="faceoff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12M8 4v5a4 4 0 0 0 8 0V4"/><path d="M12 13v4M8 21h8"/><path d="M6 6H4a2 2 0 0 0 0 4h2M18 6h2a2 2 0 0 1 0 4h-2"/></svg>Face-off</button>
    <button data-tab="taste"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg>Taste</button>
  </nav>

  <!-- Bottom sheet (detail / settings) -->
  <div class="sheetwrap" id="sheetwrap">
    <div class="dim" id="sheetDim"></div>
    <div class="sheet glass strong" id="sheet">
      <div class="grab"></div>
      <div class="body" id="sheetBody"></div>
    </div>
  </div>

  <div class="toast glass strong" id="toast"></div>

  <!-- First launch -->
  <div class="onboard" id="onboard" style="display:none">
    <div class="glass strong">
      <div class="shaperow" aria-hidden="true">
        <svg viewBox="-30 -30 60 60"><circle r="22" fill="#38bdf8"/></svg>
        <svg viewBox="-30 -30 60 60"><polygon points="0,-24 24,18 -24,18" fill="#fbbf24"/></svg>
        <svg viewBox="-30 -30 60 60"><rect x="-20" y="-20" width="40" height="40" rx="7" fill="#34d399"/></svg>
        <svg viewBox="-30 -30 60 60"><polygon points="0,-25 8,-8 26,-8 12,3 17,21 0,11 -17,21 -12,3 -26,-8 -8,-8" fill="#fb7185"/></svg>
        <svg viewBox="-30 -30 60 60"><polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#a78bfa"/></svg>
      </div>
      <div class="logo">Re<em>name</em></div>
      <div class="sub">A name for our son — chosen together.<br>Who's holding this phone?</div>
      <div class="who" id="onboardWho"></div>
      <button class="btn primary" id="onboardGo" disabled>Start</button>
      <p class="mini" style="text-align:center;margin:14px 0 0">Swipe right to like, left to pass, tap a card for its story.</p>
    </div>
  </div>
</div>

<script src="learn.js"></script>
<script src="sync.js"></script>
<script src="claude.js"></script>
<script src="app.js"></script>
</body>
</html>
